version: 2
updates:
  # pnpm workspaces are updated through the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The converter image pins a Playwright release. Its Chromium opens untrusted
  # pages, so keep it current.
  - package-ecosystem: docker
    directory: /apps/converter
    schedule:
      interval: weekly
